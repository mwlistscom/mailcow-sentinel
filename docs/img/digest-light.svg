  <line x1="0" y1="34" x2="830" y2="34" stroke="#e2e6ed"/>
  <circle cx="22" cy="17" r="5.5" fill="#d3d8e2"/><circle cx="39" cy="17" r="5.5" fill="#d3d8e2"/><circle cx="56" cy="17" r="5.5" fill="#d3d8e2"/>
  <text x="76" y="22" fill="#67717f" font-size="11.5"
