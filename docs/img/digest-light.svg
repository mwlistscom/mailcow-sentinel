    <text x="22.0" y="175" fill="#1f5fa8" font-weight="600" xml:space="preserve">FLOW</text>
    <text x="53.2" y="175" fill="#1f2430" xml:space="preserve">        168 received - 157 delivered - 1 sent externally</text>
