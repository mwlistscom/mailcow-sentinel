    <text x="22.0" y="764" fill="#1f2430" xml:space="preserve">            netfilter&#x27;s own rule banned 5 separately</text>
    <text x="22.0" y="802" fill="#1f5fa8" font-weight="600" xml:space="preserve">REJECTS</text>
    <text x="76.7" y="802" fill="#1f2430" xml:space="preserve">     Service unavailable (32); Greylisted, try again later (8)</text>
