    <text x="22.0" y="688" fill="#1f2430" xml:space="preserve">                    198.51.100.14    3 days, 9 attempts, since 2026-09-07</text>
    <text x="22.0" y="707" fill="#1f2430" xml:space="preserve">                  8 of them were never banned - these are the single-mailbox</text>
    <text x="22.0" y="726" fill="#1f2430" xml:space="preserve">                  attempts authguard deliberately leaves alone</text>
    <text x="22.0" y="764" fill="#1f2430" xml:space="preserve">FRONT DOOR        678 connections from 471 IPs -&gt; 168 messages (25% yielded mail)</text>
    <text x="22.0" y="783" fill="#1f2430" xml:space="preserve">                  254 connected and vanished - 247 failed TLS - 212 abandoned mid-auth</text>
