    <text x="22.0" y="61" fill="#67717f" xml:space="preserve">Subject:</text>
    <text x="84.5" y="61" fill="#0b0e14" font-weight="600" xml:space="preserve"> [mail.example.com] ATTENTION - credential stuffing vs bob@, carol@,</text>
