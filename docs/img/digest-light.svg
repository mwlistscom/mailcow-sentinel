    <text x="162.6" y="61" fill="#b3261e" font-weight="600" xml:space="preserve">ATTENTION</text>
    <text x="232.9" y="61" fill="#1f2430" xml:space="preserve"> - credential stuffing vs bob@, carol@, alice@;</text>
    <text x="22.0" y="80" fill="#8a5a00" xml:space="preserve">                  breach-dump usernames in use against this server</text>
    <text x="22.0" y="118" fill="#1f5fa8" font-weight="600" xml:space="preserve">FLOW</text>
    <text x="53.2" y="118" fill="#1f2430" xml:space="preserve">              168 received - 157 delivered - 1 sent externally</text>
    <text x="22.0" y="137" fill="#1f2430" xml:space="preserve">                  0 deferred - 0 bounced - 24 rejected (14 greylist, 10 hard)</text>
    <text x="22.0" y="156" fill="#1f2430" xml:space="preserve">                  queue 0 - containers 18/18 - cert 57d</text>
    <text x="22.0" y="194" fill="#1f5fa8" font-weight="600" xml:space="preserve">ACCOUNTS</text>
    <text x="84.5" y="194" fill="#1f2430" xml:space="preserve">                              recv  sent    vs 7d</text>
