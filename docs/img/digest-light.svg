    <text x="22.0" y="460" fill="#1f2430" xml:space="preserve">                    httpspa.fadv.combob@example.com</text>
    <text x="22.0" y="479" fill="#1f2430" xml:space="preserve">                    www.att.commyalice@example.com</text>
    <text x="22.0" y="498" fill="#8a5a00" xml:space="preserve">                  -&gt; these addresses are in a public combolist;</text>
    <text x="22.0" y="517" fill="#8a5a00" xml:space="preserve">                     check those mailbox passwords are not reused</text>
    <text x="22.0" y="555" fill="#1f2430" xml:space="preserve">MAILCOW-SENTINEL  31 banned today - 96 on the denylist now - 4 expiring within 24h</text>
    <text x="22.0" y="574" fill="#1f2430" xml:space="preserve">                  by signal: enumerating 22, nonexistent-identity 9</text>
