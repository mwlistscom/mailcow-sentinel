    <text x="482.8" y="213" fill="#6a93c8" xml:space="preserve">##################</text>
    <text x="22.0" y="232" fill="#1f2430" xml:space="preserve">                  dave@example.com      35     0       --  </text>
    <text x="482.8" y="232" fill="#6a93c8" xml:space="preserve">###########</text>
    <text x="22.0" y="251" fill="#1f2430" xml:space="preserve">                  carol@example.com     28     0       --  </text>
    <text x="482.8" y="251" fill="#6a93c8" xml:space="preserve">#########</text>
    <text x="22.0" y="270" fill="#1f2430" xml:space="preserve">                  erin@example.com      27     0       --  </text>
