    <text x="22.0" y="859" fill="#1f2430" xml:space="preserve">BLOCKLISTS        69 IPs listed - hostkarma 112, spamhaus zen 74, mailspike 3, spameatingmonkey 3, spamcop 2, suomispam 1</text>
    <text x="22.0" y="878" fill="#1f2430" xml:space="preserve">                  allowlisted: dnswl 20, mailspike 6</text>
    <text x="22.0" y="916" fill="#1f5fa8" font-weight="600" xml:space="preserve">REJECTS</text>
    <text x="76.7" y="916" fill="#1f2430" xml:space="preserve">           Greylisted, please try again later (11); Service unavailable (8); Protocol error (2)</text>
    <text x="22.0" y="954" fill="#1f5fa8" font-weight="600" xml:space="preserve">NEW</text>
    <text x="45.4" y="954" fill="#1f2430" xml:space="preserve">               2 warning class(es) not seen in the previous 7 days:</text>
    <text x="22.0" y="973" fill="#1f2430" xml:space="preserve">                    9x warning: TLS SNI from unknown[203.0.113.9] is invalid: 198.51.100.1</text>
    <text x="22.0" y="992" fill="#1f2430" xml:space="preserve">                    2x warning: hostname scanner.example.net does not resolve to address 203.0.113.44</text>
    <text x="22.0" y="1030" fill="#1f5fa8" font-weight="600" xml:space="preserve">TRIAGE</text>
    <text x="68.9" y="1030" fill="#1f2430" xml:space="preserve">            (qwen3.6:27b, advisory - classification only)</text>
    <text x="22.0" y="1049" fill="#1f2430" xml:space="preserve">                    note Transient DNS failure for an external sender hostname.   (x2)</text>
    <text x="22.0" y="1068" fill="#1f2430" xml:space="preserve">                    ignore Automated scanner probing non-SMTP ports and invalid SNI.</text>
    <text x="22.0" y="1106" fill="#0f7b2f" font-weight="600" xml:space="preserve">OK</text>
