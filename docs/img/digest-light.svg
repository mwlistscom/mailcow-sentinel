    <text x="22.0" y="1125" fill="#1f2430" xml:space="preserve">                  expected external sender: app@example.com via webhost.example.net[203.0.113.7]</text>
    <text x="22.0" y="1163" fill="#67717f" xml:space="preserve">-- 6058 log lines from the Redis rings, 2026-09-09. Chart attached.</text>
