    <text x="22.0" y="118" fill="#1f5fa8" font-weight="600" xml:space="preserve">VERDICT</text>
    <text x="76.7" y="118" fill="#1f2430" xml:space="preserve">     </text>
    <text x="115.7" y="118" fill="#b3261e" font-weight="600" xml:space="preserve">ATTENTION</text>
    <text x="186.0" y="118" fill="#1f2430" xml:space="preserve"> - credential stuffing vs bob@, carol@, alice@;</text>
