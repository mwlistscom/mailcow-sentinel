    <text x="22.0" y="897" fill="#1f5fa8" font-weight="600" xml:space="preserve">TRIAGE</text>
    <text x="68.9" y="897" fill="#1f2430" xml:space="preserve">      (qwen3.6:27b, advisory - classification only)</text>
    <text x="22.0" y="916" fill="#1f2430" xml:space="preserve">              ignore Automated scanner probing non-SMTP ports and invalid SNI.</text>
    <text x="22.0" y="954" fill="#0f7b2f" font-weight="600" xml:space="preserve">OK</text>
    <text x="37.6" y="954" fill="#1f2430" xml:space="preserve">          no unexplained logins - no delivery failures - 18/18 containers up</text>
    <text x="22.0" y="992" fill="#67717f" xml:space="preserve">-- 6058 log lines from the Redis rings, 2026-09-09. Chart attached.</text>
